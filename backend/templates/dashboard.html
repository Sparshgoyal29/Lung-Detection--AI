<!DOCTYPE html>
<html>

<head>

<title>SND Hospital Dashboard</title>

<style>

body{
    font-family:Arial;
    padding:20px;
    background:#f4f4f4;
}

h1{
    text-align:center;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th, td{
    border:1px solid #ddd;
    padding:12px;
    text-align:center;
}

th{
    background:#007bff;
    color:white;
}

tr:nth-child(even){
    background:#f2f2f2;
}

</style>

</head>

<body>

<h1>SND Hospital Dashboard</h1>

<table>

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Age</th>
    <th>Gender</th>
    <th>Phone</th>
    <th>Result</th>
    <th>Confidence</th>
    <th>Delete</th>
</tr>

{% for row in patients %}

<tr>
    <td>{{ row[0] }}</td>
    <td>{{ row[1] }}</td>
    <td>{{ row[2] }}</td>
    <td>{{ row[3] }}</td>
    <td>{{ row[4] }}</td>
    <td>{{ row[5] }}</td>
    <td>{{ row[6] }}%</td>

    <td>
        <a href="/delete/{{ row[0] }}">
            Delete
        </a>
    </td>
</tr>

{% endfor %}

</table>

</body>

</html>
